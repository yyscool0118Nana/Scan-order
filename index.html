<!DOCTYPE html>
<html>
<head>
  <title>My Restaurant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    .menu-item {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .price {
      color: #e63946;
      font-weight: bold;
    }

    button {
      background: #e63946;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .quantity button {
      background: #333;
      padding: 6px 12px;
    }

    #cart {
      background: #222;
      color: white;
      padding: 20px;
      margin-top: 30px;
      border-radius: 12px;
    }

    .cart-item {
      padding: 10px 0;
      border-bottom: 1px solid #555;
    }

    #checkout {
      width: 100%;
      margin-top: 20px;
      background: #2a9d8f;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>🍽️ My Restaurant</h1>

  <div class="menu-item">
    <h2>Nasi Goreng</h2>
    <p>Fried rice with egg and vegetables.</p>
    <p class="price">RM 12.00</p>

    <button onclick="addToCart('Nasi Goreng', 12)">
      Add to Order
    </button>
  </div>

  <div class="menu-item">
    <h2>Chicken Rice</h2>
    <p>Steamed chicken served with fragrant rice.</p>
    <p class="price">RM 10.00</p>

    <button onclick="addToCart('Chicken Rice', 10)">
      Add to Order
    </button>
  </div>

  <div class="menu-item">
    <h2>Iced Tea</h2>
    <p>Refreshing cold tea.</p>
    <p class="price">RM 4.00</p>

    <button onclick="addToCart('Iced Tea', 4)">
      Add to Order
    </button>
  </div>


  <div id="cart">

    <h2>🛒 Your Order</h2>

    <div id="cart-items">
      Your cart is empty.
    </div>

    <h3 id="total">Total: RM 0.00</h3>

    <button id="checkout" onclick="checkout()">
      🛒 Checkout
    </button>

  </div>


  <script>

    let cart = [];


    function addToCart(name, price) {

      let existingItem = cart.find(item => item.name === name);

      if (existingItem) {

        existingItem.quantity++;

      } else {

        cart.push({
          name: name,
          price: price,
          quantity: 1
        });

      }

      displayCart();
    }


    function increase(name) {

      let item = cart.find(item => item.name === name);

      item.quantity++;

      displayCart();
    }


    function decrease(name) {

      let item = cart.find(item => item.name === name);

      item.quantity--;

      if (item.quantity <= 0) {

        cart = cart.filter(item => item.name !== name);

      }

      displayCart();
    }


    function displayCart() {

      let cartItems = document.getElementById("cart-items");

      let total = 0;

      cartItems.innerHTML = "";


      if (cart.length === 0) {

        cartItems.innerHTML = "Your cart is empty.";

      }


      cart.forEach(function(item) {

        let itemTotal = item.price * item.quantity;

        total += itemTotal;


        let itemElement = document.createElement("div");

        itemElement.className = "cart-item";


        itemElement.innerHTML = `

          <strong>${item.name}</strong>

          <br>

          RM ${itemTotal.toFixed(2)}

          <div class="quantity">

            <button onclick="decrease('${item.name}')">
              −
            </button>

            ${item.quantity}

            <button onclick="increase('${item.name}')">
              +
            </button>

          </div>

        `;


        cartItems.appendChild(itemElement);

      });


      document.getElementById("total").textContent =
        "Total: RM " + total.toFixed(2);

    }


    function checkout() {

      if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

      }

      alert("Checkout coming next!");

    }

  </script>

</body>
</html>
