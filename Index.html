<!DOCTYPE html>
<html>
<head>
  <title>My Restaurant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    .menu-item {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .price {
      color: #e63946;
      font-weight: bold;
    }

    button {
      background: #e63946;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>🍽️ My Restaurant</h1>

  <div class="menu-item">
    <h2>Nasi Goreng</h2>
    <p>Fried rice with egg and vegetables.</p>
    <p class="price">RM 12.00</p>
    <button>Add to Order</button>
  </div>

  <div class="menu-item">
    <h2>Chicken Rice</h2>
    <p>Steamed chicken served with fragrant rice.</p>
    <p class="price">RM 10.00</p>
    <button>Add to Order</button>
  </div>

  <div class="menu-item">
    <h2>Iced Tea</h2>
    <p>Refreshing cold tea.</p>
    <p class="price">RM 4.00</p>
    <button>Add to Order</button>
  </div>

</body>
</html>
